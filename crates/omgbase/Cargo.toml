[package]
name = "omgbase"
version = "0.10.0"
description = "omgbase: a versioned, addressable graph layer over authored Markdown — the `omgbase` binary (`omgbase mcp` serves the tool catalog over MCP stdio, with the filesystem watcher and the background embed drain)"
keywords = ["markdown", "mcp", "knowledge-base", "sqlite", "omgbase"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
homepage = "https://github.com/omgbase/omgbase/tree/main/crates/omgbase#readme"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "omgbase"
path = "src/main.rs"

[dependencies]
# The catalog this binary serves.
omgbase-surface = { version = "1.5.0", path = "../omgbase-surface" }
# Workspace discovery and repo selection (`spec/sync` §1), the settings the
# embedding provider is read from; `http` for `--server https://…` (the MCP
# engine client over Streamable HTTP).
omgbase-sync = { version = "1.3.2", path = "../omgbase-sync", features = ["http"] }
# The store the surface owns (opened from the workspace's database path).
omgbase-store = { version = "13.5.3", path = "../omgbase-store" }
# The external embedding provider behind `semantic()` / `resolve`.
omgbase-search = { version = "1.2.1", path = "../omgbase-search" }
# The YAML core schema: `meta --set k=v` resolves its value as a YAML scalar.
omgbase-properties = { version = "1.1.1", path = "../omgbase-properties" }
# JSON-RPC framing; the CLI's `--json` documents (key order as produced).
serde_json = { version = "1", features = ["preserve_order"] }
# The query language's parser: the projected column names of a `select` for
# the hit table (`spec/cli` §4 — a projected key prints its header even when
# every hit lacks it).
oqx = { version = "0.16.0", path = "../oqx" }
# The store's connection: the CLI's own row reads (`log --since`, `links`).
rusqlite = { version = "0.40", features = ["bundled"] }
# `signal(2)` for SIGINT/SIGTERM shutdown of the watcher and the drainer
# (unix only, like omgbase-sync's lock liveness probe).
libc = "0.2"

[lints]
workspace = true
