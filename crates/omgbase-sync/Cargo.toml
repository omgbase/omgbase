[package]
name = "omgbase-sync"
version = "1.2.1"
description = "omgbase sync: workspace discovery and repo selection, the source registry and settings, checkpoints and the filesystem freshness sweep, the adapter stdio protocol client, the coordinator over an engine client, the writer lock and watch lease — Rust implementation"
keywords = ["markdown", "sync", "sqlite", "filesystem", "omgbase"]
categories = ["filesystem", "text-processing"]
readme = "README.md"
homepage = "https://github.com/omgbase/omgbase/tree/main/crates/omgbase-sync#readme"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# The Streamable HTTP transport of the MCP engine client (`--server https://…`).
# Off by default: it brings a TLS stack; the stdio transport needs nothing.
http = ["dep:ureq"]

[dependencies]
# The store: the database this layer's registry, settings, checkpoints and
# file_stats live in; `observe_batch`/`observe_delete` (spec/store §5), the
# reconciling ingest, `changes_since`, `reconstruct`, the `IdMinter` seam.
omgbase-store = { version = "13.5.0", path = "../omgbase-store" }
# The matcher thresholds every ingest takes (`Config`).
omgbase-reconcile = { version = "2.3.0", path = "../omgbase-reconcile" }
# `sha256`/`hex` for file hashes (spec/store §2.3).
omgbase-format = { version = "0.2.1", path = "../omgbase-format" }
# Registry / settings / checkpoint rows are read and written through the
# store's connection.
rusqlite = { version = "0.40", features = ["bundled"] }
# Settings blobs, `checkpoints.files`, adapter/source JSON columns, the NDJSON
# adapter protocol. `preserve_order`: the protocol lines are compared byte for
# byte against the reference, and `deep_merge` keeps key order.
serde_json = { version = "1", features = ["preserve_order"] }
# `kill(pid, 0)` for lock-holder liveness (spec/sync §7).
libc = "0.2"
# The Streamable HTTP transport of `mcp_client` (feature `http`), the same
# crate and gate as omgbase-search's http embedding provider.
ureq = { version = "3", optional = true }

[lints]
workspace = true
