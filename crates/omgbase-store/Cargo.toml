[package]
name = "omgbase-store"
version = "13.3.0"
description = "omgbase store: the embedded SQLite database that owns block identity, history and current state — Rust implementation"
keywords = ["markdown", "sqlite", "versioning", "blocks", "omgbase"]
categories = ["database-implementations", "text-processing"]
readme = "README.md"
homepage = "https://github.com/omgbase/omgbase/tree/main/crates/omgbase-store#readme"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The block model: `parse_markdown`, `BlockTree`, the spec/format §4.1 text
# rules, the §4.2 hashes and the splice renderer. `json` for attrs as JSON.
omgbase-format = { version = "0.2.1", path = "../omgbase-format", features = ["json"] }
# The matcher: `reconcile_document`, the pool, cross-document moves. `json`
# for the disposition `detail` the store persists.
omgbase-reconcile = { version = "2.3.0", path = "../omgbase-reconcile", features = ["json"] }
# The properties rows (`spec/properties`): frontmatter, inline fields and
# computed intrinsics, written inside the commit transaction (§5.4).
omgbase-properties = { version = "1.0.0", path = "../omgbase-properties" }
# The graph projection and extraction (`spec/graph`): nodes with byte spans,
# edge descriptors, URI normalization and relative-path resolution; the store
# resolves, mints `x`/`e`, keeps the intervals and the rollup (store 13.2).
omgbase-graph = { version = "1.0.0", path = "../omgbase-graph" }
# The search layer (`spec/search`): the FTS sanitizer, embedding inputs and
# cache keys, pooling, cosine, fusion and boosts, the provider seam; the
# store runs the queries and the drain over its caches (store 13.3).
omgbase-search = { version = "1.0.0", path = "../omgbase-search" }
# `bundled`: compile SQLite from source (FTS5 + JSON1 included) so the crate
# needs no system library; the same version the `oqx` crate uses, so the
# workspace builds one SQLite. `functions`: the `cosine` scalar.
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
# The store writes JSON columns (`attrs`, `detail`) and reads tree entries.
serde_json = { version = "1", features = ["preserve_order"] }
# CSPRNG for production ids (spec/store §2.1).
getrandom = "0.3"

[lints]
workspace = true
